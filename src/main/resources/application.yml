spring:
  application:
    name: personal-finance-ledger
  datasource:
    url: jdbc:sqlite:${finance.data-dir:./data}/finances.db?foreign_keys=true&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  shutdown: graceful

finance:
  data-dir: ./data
  backup:
    dir: ./data/backups
    retention: 14
    cron: "0 0 3 * * *"
