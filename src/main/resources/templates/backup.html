<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Backup')}"></head>
<body class="bg-slate-50 text-slate-800">
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="mx-auto max-w-4xl space-y-6 px-4 py-6">
    <h1 class="text-xl font-semibold">Backup &amp; restore</h1>

    <section class="card flex flex-wrap items-center gap-3 p-4">
        <a href="/backup/download" class="btn btn-primary">Download snapshot</a>
        <button hx-post="/backup/snapshots" class="btn">Save a snapshot on this machine</button>
        <span class="text-xs text-slate-500">A snapshot is the whole <code>finances.db</code> file; copy it to another macOS or Windows machine to move your data.</span>
    </section>

    <section class="card p-4">
        <h2 class="section-title">Restore from a file</h2>
        <form hx-post="/backup/restore" hx-encoding="multipart/form-data" hx-confirm="Replace all current data with this file? A pre-restore snapshot is kept." class="mt-3 flex flex-wrap items-end gap-3">
            <label class="field">Database file<input type="file" name="file" accept=".db,.sqlite,.sqlite3" required class="input"></label>
            <button class="btn btn-primary">Restore</button>
        </form>
    </section>

    <section class="card overflow-x-auto">
        <h2 class="section-title p-4 pb-0">Snapshots on this machine</h2>
        <table class="grid-table">
            <thead><tr><th class="text-left">File</th><th>Size</th><th class="text-left">Created</th><th></th></tr></thead>
            <tbody>
            <tr th:each="b : ${backups}">
                <td class="font-mono text-xs" th:text="${b.fileName()}">file.db</td>
                <td class="num" th:text="${#numbers.formatInteger(b.sizeBytes() / 1024, 1, 'POINT')} + ' KB'">0 KB</td>
                <td th:text="${@fmt.dateTime(b.createdAt())}">date</td>
                <td class="whitespace-nowrap text-right">
                    <a class="btn" th:href="@{/backup/files/{n}(n=${b.fileName()})}">Download</a>
                    <button class="btn" hx-confirm="Replace all current data with this snapshot?"
                            th:attr="hx-post=@{/backup/files/{n}/restore(n=${b.fileName()})}">Restore</button>
                </td>
            </tr>
            <tr th:if="${backups.isEmpty()}"><td colspan="4" class="text-slate-500">No snapshots yet. Automatic daily backups appear here.</td></tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
